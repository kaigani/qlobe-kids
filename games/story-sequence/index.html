<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#bee3f5" />
  <title>First, Next, Last 📖 — Put the Story in Order</title>
  <meta name="description" content="Put picture cards in order, first, next, last, and hear the finished story told back aloud. A warm sequencing game for ages 5–6." />

  <!-- Open Graph (Facebook, iMessage, Slack, WhatsApp, LinkedIn…) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="First, Next, Last" />
  <meta property="og:title" content="First, Next, Last 📖 — Put the Story in Order" />
  <meta property="og:description" content="Put picture cards in order, first, next, last, and hear the finished story told back aloud. A warm sequencing game for ages 5–6." />
  <meta property="og:url" content="https://qlo.be/games/story-sequence/" />
  <meta property="og:image" content="https://qlo.be/games/story-sequence/assets/og-image.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="First, Next, Last title screen with First, Next, Last and My Day modes and an open storybook icon." />

  <!-- Twitter / X card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="First, Next, Last 📖 — Put the Story in Order" />

  <link rel="icon" type="image/png" href="../../assets/favicon.png" />
  <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png" />
  <style>
    /* Stub games share the engine's built-in styles; this file stays minimal.
       The engine injects its own stylesheet so sequence games feel consistent. */
    @font-face {
      font-family: 'Fredoka';
      src: url('../../shared/fonts/fredoka-latin-600-normal.woff2') format('woff2');
      font-weight: 600;
      font-display: swap;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: 'Fredoka', 'Arial Rounded MT Bold', sans-serif;
      background: #bee3f5;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    #game { height: 100dvh; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module">
    import config from './config.js';
    import { createGame } from '../../shared/js/engines/sequence-order.js';

    createGame(config, document.getElementById('game'));
  </script>
</body>
</html>
