  <link rel="icon" type="image/png" href="../../assets/favicon.png" />

  <link rel="stylesheet" href="css/style.css" />

<body>
  <!-- game-design.md §2. Seven screens, one #app. Nothing here holds a word a
       CHILD has to read: every label in this file is either an aria-label, the
       adult caption in #banner, or the grown-up "Play" affordance of §2.3. -->
  <div id="app" data-screen="splash">

    <!-- The decorative field the framed stage sits on (§2.5a): a blurred,
         dimmed DUPLICATE of the plate the stage is currently showing, the same
         treatment the splash gives the hotel. Empty on a tablet, where the
         stage fills the window and CSS keeps this display:none. -->
    <div id="stage-surround" aria-hidden="true"></div>

    <!-- z0–z4: the hotel and the rooms. shared/js/hotspot-scene.js mounts
         itself in here, and shared/js/magnifier-lens.js mounts inside that. -->
    <div id="stage"></div>

    <!-- h1/h2: the HUD, CSS px, above the scene (§2.5) -->
    <div id="hud" hidden>
      <button id="btn-back" class="corner-btn back" type="button" aria-label="Back"></button>
      <button id="btn-sound" class="corner-btn sound" type="button" aria-label="Hear it again"></button>
      <!-- An adult caption, never a control: pointer-events are off in CSS. -->
      <div id="banner" role="status" aria-live="polite" hidden></div>
      <img id="target-plaque" alt="" hidden />
      <button id="btn-journal" class="journal-tab" type="button" aria-label="My bug book"></button>
      <div id="pips" aria-hidden="true"></div>
    </div>

    <!-- SPLASH (§2.3) -->
    <section id="splash" class="screen" aria-label="Bug Hotel Observer">
      <button id="splash-home" class="corner-btn home" type="button" aria-label="All games"></button>
      <button id="splash-sound" class="corner-btn sound" type="button" aria-label="Hear it again"></button>
      <img id="splash-title" class="lockup title" alt="Bug Hotel Observer" />
      <div id="play-stack">
        <button id="btn-play" class="play-btn" type="button" aria-label="Play"></button>
        <span id="play-label">Play</span>
      </div>
      <div id="mode-row" hidden></div>
    </section>

    <!-- REWARD (§2.6) / MY BUG BOOK (§2.7) / CELEBRATION (§2.8) are ONE spread:
         the same paper, opened over whatever screen the child came from. -->
    <section id="spread" class="screen" aria-label="My bug book" hidden>
      <div id="spread-paper">
        <button id="spread-back" class="corner-btn back" type="button" aria-label="Back"></button>
        <img id="fact-found" class="lockup" alt="Fact found" hidden />
        <div id="fact-row" hidden>
          <img id="fact-bug" alt="" />
          <div id="fact-card"><p id="fact-text"></p></div>
        </div>
        <!-- §2.6's foot: "[ sticker grid, 4 × 3 ]      ( Next Room )". On the
             book and the celebration the fact row above is gone and the grid
             takes the whole spread. -->
        <div id="spread-foot">
          <div id="sticker-grid" class="sticker-grid"></div>
          <button id="btn-next" class="play-btn" type="button" aria-label="Next room"></button>
        </div>
      </div>
      <div id="fly-layer" aria-hidden="true"></div>
      <div id="confetti" aria-hidden="true"></div>
    </section>

    <!-- END (§2.8) -->
    <section id="end" class="screen" aria-label="Every bug found" hidden>
      <button id="end-back" class="corner-btn back" type="button" aria-label="Back"></button>
      <div id="end-inner">
        <div id="end-grid" class="sticker-grid"></div>
        <button id="btn-again" class="play-btn" type="button" aria-label="Play again"></button>
      </div>
    </section>

  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
