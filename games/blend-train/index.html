    /* Stub games share the engine's built-in styles; this page only mounts it. */
    @font-face {
      font-family: 'Fredoka';
      src: url('../../shared/fonts/fredoka-latin-600-normal.woff2') format('woff2');
      font-weight: 600;
      font-display: swap;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: 'Fredoka', 'Arial Rounded MT Bold', sans-serif;
      background: #bee3f5;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    #game { min-height: 100dvh; }
  </style>
  <!-- Game-local styling. The engine injects its shared stylesheet at runtime, so this
       link lands earlier in the cascade; every rule inside is scoped under #game so it
       still outranks the engine's. Only this game loads it — the other 14
       build-assemble games are untouched. -->
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="game"></div>
  <script type="module">
    import config from './config.js';
    import { createGame } from '../../shared/js/engines/build-assemble.js';
    createGame(config, document.getElementById('game'));
  </script>
