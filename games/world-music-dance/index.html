  <style>
    /* The engine injects the full game UI. This shell only sets page basics. */
    @font-face {
      font-family: 'Fredoka';
      src: url('../../shared/fonts/fredoka-latin-600-normal.woff2') format('woff2');
      font-weight: 600;
      font-display: swap;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: 'Fredoka', 'Arial Rounded MT Bold', sans-serif;
      background: #bee3f5;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    #game { height: 100dvh; }
  </style>

<body>
  <div id="game"></div>
  <script type="module">
    import config from './config.js';
    import { createGame } from '../../shared/js/engines/choose-one.js';
    createGame(config, document.getElementById('game'));
  </script>
