<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#79c8e8" />
  <title>Shape Surprise Studio — Paper Shapes Become Pictures</title>
  <meta name="description" content="Tap, stretch, and fit colorful paper shapes to reveal kittens, rockets, sunny faces, sailboats, and more in a tactile papercraft garden." />

  <!-- Open Graph (Facebook, iMessage, Slack, WhatsApp, LinkedIn…) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Shape Surprise Studio" />
  <meta property="og:title" content="Shape Surprise Studio — Paper Shapes Become Pictures" />
  <meta property="og:description" content="Tap, stretch, and fit colorful paper shapes to reveal kittens, rockets, sunny faces, sailboats, and more in a tactile papercraft garden." />
  <meta property="og:url" content="https://qlo.be/games/shape-to-picture/" />
  <meta property="og:image" content="https://qlo.be/games/shape-to-picture/assets/og-image.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Colorful cut-paper shapes turning into a sailboat in a cheerful paper garden." />

  <!-- Twitter / X card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Shape Surprise Studio — Paper Shapes Become Pictures" />
  <meta name="twitter:description" content="Tap, stretch, and fit colorful paper shapes to reveal kittens, rockets, sunny faces, sailboats, and more in a tactile papercraft garden." />
  <meta name="twitter:image" content="https://qlo.be/games/shape-to-picture/assets/og-image.jpg" />

  <link rel="icon" type="image/png" href="../../assets/favicon.png" />
  <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="../../shared/css/base.css" />
  <link rel="stylesheet" href="../../shared/css/hud.css" />
  <link rel="stylesheet" href="../../shared/css/screens.css" />
  <link rel="stylesheet" href="./css/style.css" />
  <script src="../../shared/js/analytics.js"></script>
</head>
<body>
  <main id="game" aria-label="Shape Surprise Studio">
    <section id="splash" class="game-screen garden-screen splash-screen" data-qk-screen="splash">
      <a class="qk-hud-btn qk-hud-home qk-hud-top-left" href="../../" aria-label="Home"></a>
      <button id="splash-sound" class="qk-hud-btn qk-hud-sound qk-hud-top-right" type="button" aria-label="Hear the welcome again"></button>
      <div class="splash-content">
        <img class="title-art" src="./assets/ui/title.webp" alt="Shape Surprise Studio" />
        <button id="welcome-banner" class="paper-banner welcome-banner" type="button" aria-label="Hear what to do">
          <img src="./assets/ui/banner.webp" alt="" aria-hidden="true" />
          <span>Pick your paper magic</span>
        </button>
        <div id="mode-cards" class="mode-cards" aria-label="Choose a paper game"></div>
      </div>
    </section>

    <section id="play" class="game-screen garden-screen play-screen" data-qk-screen="play" hidden>
      <div class="qk-hud-bar">
        <button id="play-back" class="qk-hud-btn qk-hud-back" type="button" aria-label="Back to the studio"></button>
        <div id="progress" class="play-progress" aria-hidden="true"></div>
        <button id="play-sound" class="qk-hud-btn qk-hud-sound" type="button" aria-label="Hear the instruction again"></button>
      </div>
      <div class="play-shell">
        <button id="prompt" class="paper-banner prompt-banner" type="button" aria-label="Hear the instruction again">
          <img src="./assets/ui/banner.webp" alt="" aria-hidden="true" />
          <span id="prompt-text">Paper magic!</span>
        </button>
        <div id="play-host" class="play-host"></div>
      </div>
    </section>

    <section id="reveal" class="game-screen reveal-screen" data-qk-screen="reveal" hidden>
      <button id="reveal-back" class="qk-hud-btn qk-hud-back qk-hud-top-left" type="button" aria-label="Back to the studio"></button>
      <button id="reveal-sound" class="qk-hud-btn qk-hud-sound qk-hud-top-right" type="button" aria-label="Hear the surprise again"></button>
      <div class="reveal-content">
        <div id="reveal-art-host" class="reveal-art-host"></div>
        <button id="reveal-next" class="paper-banner next-banner" type="button" aria-label="Next surprise">
          <img src="./assets/ui/banner.webp" alt="" aria-hidden="true" />
          <span id="reveal-label">Next surprise</span>
        </button>
      </div>
    </section>

    <section id="end" class="game-screen garden-screen end-screen" data-qk-screen="end" hidden>
      <button id="end-back" class="qk-hud-btn qk-hud-back qk-hud-top-left" type="button" aria-label="Back to the studio"></button>
      <button id="end-sound" class="qk-hud-btn qk-hud-sound qk-hud-top-right" type="button" aria-label="Hear the celebration again"></button>
      <div class="end-content">
        <div class="paper-banner end-heading" aria-label="Paper magic">
          <img src="./assets/ui/banner.webp" alt="" aria-hidden="true" />
          <span>Paper magic!</span>
        </div>
        <div id="end-gallery" class="end-gallery" aria-label="Your shape surprises"></div>
        <div class="end-actions">
          <button id="play-again" class="paper-banner action-banner" type="button" aria-label="Play this game again">
            <img src="./assets/ui/banner.webp" alt="" aria-hidden="true" />
            <span>Play again</span>
          </button>
          <button id="choose-game" class="paper-banner action-banner" type="button" aria-label="Choose another paper game">
            <img src="./assets/ui/banner.webp" alt="" aria-hidden="true" />
            <span>Choose a game</span>
          </button>
        </div>
      </div>
    </section>

    <p id="live-status" class="visually-hidden" aria-live="polite"></p>
  </main>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
