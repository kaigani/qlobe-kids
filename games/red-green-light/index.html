<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Red Light, Green Light — QLOBE Kids</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0c1622" />
  <meta name="description" content="Pick a muppet-style video caller who says the cues in its own voice for a whole-body stop-and-go game." />
  <link rel="icon" type="image/png" href="../../assets/favicon.png" />
  <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png" />
  <style>
    /* The engine (js/game.js) injects its own stylesheet; this stays minimal. */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: 'Fredoka', 'Arial Rounded MT Bold', sans-serif;
      background: #0c1622;
      touch-action: manipulation;
      user-select: none; -webkit-user-select: none;
    }
    #game { height: 100dvh; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module">
    import config from './config.js';
    import { CALLERS } from './js/callers.js';
    import { createGame } from './js/game.js';
    createGame(config, CALLERS, document.getElementById('game'));
  </script>
</body>
</html>
