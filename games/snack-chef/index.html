<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#f7dfb5" />
  <title>Snack Chef — Make playful fruit snacks</title>
  <meta name="description" content="Spread, peel, slice, pour, and arrange six playful snacks — from fruit faces to rainbow plates and yogurt parfaits — in a warm storybook kitchen." />

  <!-- Open Graph (Facebook, iMessage, Slack, WhatsApp, LinkedIn…) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Snack Chef" />
  <meta property="og:title" content="Snack Chef — Make playful fruit snacks" />
  <meta property="og:description" content="Spread, peel, slice, pour, and arrange six playful snacks — from fruit faces to rainbow plates and yogurt parfaits — in a warm storybook kitchen." />
  <meta property="og:url" content="https://qlo.be/games/snack-chef/" />
  <meta property="og:image" content="https://qlo.be/games/snack-chef/assets/og-image.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Snack Chef storybook kitchen with six playful fruit recipe cards." />

  <!-- Twitter / X card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Snack Chef — Make playful fruit snacks" />
  <meta name="twitter:description" content="Spread, peel, slice, pour, and arrange six playful snacks — from fruit faces to rainbow plates and yogurt parfaits — in a warm storybook kitchen." />
  <meta name="twitter:image" content="https://qlo.be/games/snack-chef/assets/og-image.jpg" />

  <link rel="icon" type="image/png" href="../../assets/favicon.png" />
  <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="../../shared/css/base.css">
  <!-- before the game sheet: every screens.css rule is single-class, so this
       game's own .recipe-card skin wins every property it declares -->
  <link rel="stylesheet" href="../../shared/css/screens.css">
  <link rel="stylesheet" href="./css/style.css">
  <script src="../../shared/js/analytics.js"></script>
</head>
<body>
  <main id="app" aria-live="polite">
    <section id="splash" class="screen">
      <a class="hud hud-home" href="../../" aria-label="Back to all games"></a>
      <img class="title-art" src="./assets/title.webp" alt="Snack Chef">
      <img class="maya maya-splash" src="../../shared/characters/maya/portrait.png" alt="Maya">
      <div id="recipe-cards" class="recipe-cards" aria-label="Choose a snack"></div>
    </section>

    <section id="play" class="screen" hidden>
      <button id="back" class="hud hud-back" aria-label="Back to recipes"></button>
      <button id="sound" class="hud hud-sound" aria-label="Hear the instruction again"></button>
      <div id="step-rail" class="step-rail" aria-hidden="true"></div>
      <button class="prompt-card" aria-label="Hear the instruction again">
        <span id="prompt-icon" class="prompt-icon"></span>
        <span id="prompt-text"></span>
      </button>
      <div id="workboard" class="workboard" aria-label="Kitchen work board"></div>
      <div id="ingredient-tray" class="ingredient-tray" aria-label="Ingredients"></div>
    </section>

    <section id="reveal" class="screen" hidden>
      <button id="reveal-back" class="hud hud-back" aria-label="Back to recipes"></button>
      <div id="confetti" class="confetti" aria-hidden="true"></div>
      <img id="ribbon" class="ribbon" src="./assets/ui/banner-ribbon.webp" alt="" aria-hidden="true">
      <div id="stars" class="stars" aria-hidden="true">
        <img class="star" src="./assets/ui/star-gold.webp" alt="">
        <img class="star star-mid" src="./assets/ui/star-gold.webp" alt="">
        <img class="star" src="./assets/ui/star-gold.webp" alt="">
      </div>
      <img class="maya maya-reveal" src="../../shared/characters/maya/portrait.png" alt="Maya">
      <img id="finished-art" class="finished-art" alt="">
      <div id="recap" class="recap" aria-hidden="true"></div>
      <div class="reveal-actions">
        <button id="again" class="big-button replay-button" aria-label="Make this snack again"></button>
        <button id="recipes" class="big-button recipes-button" aria-label="Choose another snack"></button>
      </div>
    </section>
  </main>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
