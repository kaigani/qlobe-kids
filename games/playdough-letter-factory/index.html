<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#128f87" />
  <title>Playdough Letter Factory — Roll, Shape, and Spell</title>
  <meta name="description" content="Choose a bright dough color, roll it with real swipes, press giant uppercase impressions, build picture words, and make free-form clay art in a warm stop-motion factory." />

  <!-- Open Graph (Facebook, iMessage, Slack, WhatsApp, LinkedIn…) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Playdough Letter Factory" />
  <meta property="og:title" content="Playdough Letter Factory — Roll, Shape, and Spell" />
  <meta property="og:description" content="Choose a bright dough color, roll it with real swipes, press giant uppercase impressions, build picture words, and make free-form clay art in a warm stop-motion factory." />
  <meta property="og:url" content="https://qlo.be/games/playdough-letter-factory/" />
  <meta property="og:image" content="https://qlo.be/games/playdough-letter-factory/assets/og-image.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="A clay playdough factory with colorful dough tubs and letter-making tools." />

  <!-- Twitter / X card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Playdough Letter Factory — Roll, Shape, and Spell" />
  <meta name="twitter:description" content="Choose a bright dough color, roll it with real swipes, press giant uppercase impressions, build picture words, and make free-form clay art in a warm stop-motion factory." />
  <meta name="twitter:image" content="https://qlo.be/games/playdough-letter-factory/assets/og-image.jpg" />

  <link rel="icon" type="image/png" href="../../assets/favicon.png" />
  <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main id="app" aria-live="polite">
    <section id="splash" class="screen splash-screen">
      <a class="hud hud-home" href="../../" aria-label="Back to all games"></a>
      <button class="hud hud-sound splash-sound" type="button" aria-label="Hear the welcome"></button>
      <img class="title-art" src="./assets/ui/title.webp" alt="Playdough Letter Factory">
      <img class="mascot mascot-splash" src="./assets/ui/mascot.webp" alt="The friendly factory guide">
      <div id="mode-cards" class="mode-cards" aria-label="Choose a way to play"></div>
      <div class="splash-bubbles" aria-hidden="true"><i></i><i></i><i></i></div>
    </section>

    <section id="game-screen" class="screen hidden">
      <button id="back" class="hud hud-back" type="button" aria-label="Back to ways to play"></button>
      <button id="sound" class="hud hud-sound" type="button" aria-label="Hear the instruction again"></button>
      <header class="factory-header">
        <div id="phase-dots" class="phase-dots" aria-hidden="true"></div>
        <div id="prompt" class="prompt-pill">
          <span id="prompt-icon" class="prompt-icon" aria-hidden="true"></span>
          <span id="prompt-text"></span>
        </div>
      </header>
      <div id="playfield" class="playfield"></div>
    </section>

    <section id="reveal" class="screen reveal-screen hidden">
      <button id="reveal-back" class="hud hud-back" type="button" aria-label="Back to ways to play"></button>
      <button id="reveal-sound" class="hud hud-sound" type="button" aria-label="Hear it again"></button>
      <div id="confetti" class="confetti" aria-hidden="true"></div>
      <img class="mascot mascot-reveal" src="./assets/ui/mascot.webp" alt="">
      <div id="reveal-card" class="reveal-card"></div>
      <div class="reveal-actions">
        <button id="again" class="clay-action replay-action" type="button" aria-label="Play this one again"><span aria-hidden="true">↻</span></button>
        <button id="next" class="clay-action next-action" type="button" aria-label="Make another"><span aria-hidden="true">➜</span></button>
      </div>
    </section>
  </main>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
