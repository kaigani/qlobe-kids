<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>QLOBE Kids — Little games to play and grow!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="QLOBE Kids" />
  <meta name="theme-color" content="#bce6f8" />
  <meta name="description" content="A warm, colorful library of tiny educational games for kids aged 5–6. Pick a game and play, learn, and grow." />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="QLOBE Kids" />
  <meta property="og:title" content="QLOBE Kids — Little games to play and grow!" />
  <meta property="og:description" content="A warm, colorful library of tiny educational games for kids aged 5–6. Pick a game and play, learn, and grow." />
  <meta property="og:url" content="https://qlo.be/" />
  <meta property="og:image" content="https://qlo.be/assets/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="The QLOBE Kids game library with a featured Word Train game, colorful category chips, and toy-like game tiles." />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="QLOBE Kids — Little games to play and grow!" />
  <meta name="twitter:description" content="A warm, colorful library of tiny educational games for kids aged 5–6. Pick a game and play, learn, and grow." />
  <meta name="twitter:image" content="https://qlo.be/assets/og-image.png" />

  <link rel="icon" type="image/png" href="./assets/favicon.png" />
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="./css/hub.css" />
  <script src="shared/js/analytics.js"></script>
</head>
<body>
  <div class="web-notice" role="status">All games are a work-in-progress. Feedback welcome!</div>
  <header class="top">
    <a class="brand" href="./" aria-label="QLOBE Kids home">
      <img class="brand-logo" src="./assets/logo-horizontal-final.webp" alt="QLOBE Kids" draggable="false" />
    </a>
  </header>

  <main class="hub-shell">
    <section class="featured" aria-labelledby="featured-title">
      <img class="featured-art" id="featured-art" src="./assets/hub/heroes/letter-treasure-hunt.webp" alt="" draggable="false" />
      <div class="featured-copy">
        <p class="featured-eyebrow"><span aria-hidden="true">★</span> Featured</p>
        <h1 id="featured-title">Letter Treasure Hunt</h1>
        <a class="play-button" id="featured-play" href="./games/letter-treasure-hunt/">
          <span class="play-icon" aria-hidden="true"></span>
          <span>Play Now</span>
        </a>
      </div>
    </section>

    <nav class="category-nav" id="category-nav" aria-label="Choose a game category"></nav>

    <section class="library" aria-labelledby="library-title">
      <div class="library-heading visually-hidden">
        <h2 id="library-title">Games</h2>
        <p id="game-count" aria-live="polite"></p>
      </div>
      <div class="game-grid" id="game-grid"></div>
      <p class="empty-state" id="empty-state" hidden>No games are ready in this category yet. Try another one!</p>
      <noscript>
        <div class="noscript-links">
          <a href="./games/sound-sprouts/">Play Sound Sprouts</a>
          <a href="./grown-ups/">For grown-ups</a>
        </div>
      </noscript>
    </section>
  </main>

  <footer class="bottom">
    <p>Little games to play and grow!</p>
    <a href="./grown-ups/">For grown-ups</a>
  </footer>

  <footer class="web-credit">
    <span>Created by <a href="https://www.linkedin.com/in/kaigani/" target="_blank" rel="noopener noreferrer">Kai Turner</a>, CC BY 4.0</span>
  </footer>

  <script type="module" src="./js/hub.js"></script>
</body>
</html>
